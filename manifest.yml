function:
  name: FetchAutoProSaleDetailFn
  runtime: python3.12
  handler: handler.lambda_handler
  description: |
    Extrae en modo solo lectura el detalle completo de ventas AutoPro por folio
    para Daniel Achondo. En modo batch procesa folios secuencialmente, aisla
    fallas por folio, sube el resultado completo como JSON de sesion y retorna
    solo file_uuid, conteos y resumen de fallas. Promueve descuentos desde los
    campos exactos del wizard y bono_descuento/bono_descuento_pct desde la fila
    exacta Bono Descuento de Resumen Venta.
  timeout: 600
  memory_size: 1024

  layers:
    - foundationMinimal
    - foundationApi
    - custom/browserbase_layer

  parameters:
    required:
      - name: node_id
        type: string
        description: Node ID for widget configuration injection
    optional:
      - name: folio
        type: string
        description: Folio AutoPro unico para compatibilidad legacy; retorna el detalle inline.
      - name: folios
        type: array
        description: Lista de folios AutoPro a consultar en batch; el resultado completo se sube como JSON.
      - name: input_file_uuid
        type: string
        description: UUID generico de archivo JSON de sesion con folios, ventas, sales, items o records.
      - name: file_uuid
        type: string
        description: Alias generico de input_file_uuid para compatibilidad de pipeline.
      - name: branch
        type: string
        description: Codigo de sucursal AutoPro. Default 698 (ANDES MOTOR).
      - name: delay_seconds
        type: number
        description: Pausa polite entre folios batch. Default 1.5; maximo 30.
        default: 1.5
      - name: output_filename
        type: string
        description: Nombre del JSON de resultados batch a subir a la sesion.
        default: autopro_sale_detail_results.json
      - name: verbose
        type: boolean
        description: Enable verbose logging
        default: false

  widget:
    enabled: true
    type: dynamic_widget
    params:
      - name: widget_param_1
        type: secret
        required: true
        description: Usuario AutoPro (email) para login en el portal
      - name: widget_param_2
        type: secret
        required: true
        description: Contrasena AutoPro

  testing:
    handles_files: true
    produces_files: true
