function:
  name: FetchAutoProSaleDetailFn
  runtime: python3.12
  handler: handler.lambda_handler
  description: |
    Extrae en modo solo lectura el detalle completo de una venta AutoPro por
    folio para Daniel Achondo. Abre el wizard Editar Venta Vehiculo, preserva
    campos crudos por pestana y promueve comentario, uso, tipo de venta,
    forma de pago, descuentos, total y fecha de entrega para conciliacion.
  timeout: 600
  memory_size: 1024

  layers:
    - foundationMinimal
    - foundationApi
    - custom/browserbase_layer

  parameters:
    required:
      - name: node_id
        type: string
        description: Node ID for widget configuration injection
      - name: folio
        type: string
        description: "Folio AutoPro de la venta a consultar en modo solo lectura. Primer hito autorizado: 7954."
    optional:
      - name: branch
        type: string
        description: Codigo de sucursal AutoPro. Default 698 (ANDES MOTOR).
      - name: verbose
        type: boolean
        description: Enable verbose logging
        default: false

  widget:
    enabled: true
    type: dynamic_widget
    params:
      - name: widget_param_1
        type: secret
        required: true
        description: Usuario AutoPro (email) para login en el portal
      - name: widget_param_2
        type: secret
        required: true
        description: Contrasena AutoPro

  testing:
    handles_files: true
    produces_files: false
